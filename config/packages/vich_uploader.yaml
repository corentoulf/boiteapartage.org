vich_uploader:
    db_driver: orm

    metadata:
        type: attribute
        auto_detection: true

    mappings:
        items:
            uri_prefix: /images/items
            upload_destination: '%kernel.project_dir%/public/images/items'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_remove: true
